name: Health check
# Every 6 hours, even with the Mac off: is the site up, are pins flowing, is
# Pinterest importing them, are workflows/keys OK? Results: data/state/health.json
# (the Claude check task on the Mac reads it, fixes what it can, emails the rest).
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run checks
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python src/health.py
      - name: Save result
        run: |
          git config user.name "pin-bot"
          git config user.email "pin-bot@users.noreply.github.com"
          git add data/state/health.json
          git diff --cached --quiet && exit 0
          git commit -q -m "health check $(date -u +%FT%H:%MZ)"
          git pull -q --rebase && git push -q
