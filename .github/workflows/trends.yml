name: Trend scan
# Weekly, right after the free Gemini quota resets (~08:00 UTC): find rising
# high-protein food trends (web search, or this month's news headlines when the
# free search quota is gone). New recipes lean ~1/3 toward them.
on:
  schedule:
    - cron: "40 8 * * 1"
  workflow_dispatch:

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan trends
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python src/trends.py
      - name: Save
        run: |
          git config user.name "pin-bot"
          git config user.email "pin-bot@users.noreply.github.com"
          git add data/state/trends.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "trends $(date -u +%F)"
          git pull -q --rebase && git push -q
