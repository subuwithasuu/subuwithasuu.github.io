name: Weekly report
# Opens a GitHub Issue with the week's summary. GitHub emails new issues
# in your own repo to you, so this lands in your inbox without any password.
on:
  schedule:
    - cron: "30 3 * * 1"       # Mondays 03:30 UTC (09:00 IST)
  workflow_dispatch:

permissions:
  contents: write        # saves metrics.json + learnings.json for the feedback loop
  issues: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build report
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_API_BASE: ${{ vars.PINTEREST_API_BASE || 'https://api.pinterest.com/v5' }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python src/weekly_report.py
      - name: Open issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "Weekly Pinterest report $(date -u +%F)" --body-file report.md
      - name: Save learnings
        run: |
          git config user.name "pin-bot"
          git config user.email "pin-bot@users.noreply.github.com"
          git add data/state
          git diff --cached --quiet && exit 0
          git commit -q -m "weekly learnings $(date -u +%F)"
          git pull -q --rebase && git push -q
