name: Content
# Daily: writes + fact-checks recipes (Gemini free tier) only when needed:
# builds the first library ~25 recipes/day, then tops up when unposted
# content drops below 3 weeks. Commits them, then rebuilds the website.
on:
  schedule:
    - cron: "0 2 * * *"        # 02:00 UTC
    - cron: "0 14 * * *"       # 14:00 UTC (second daily run spreads the free-tier quota)
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = only if needed; weekly = force recipes_per_week now"
        type: choice
        options: [auto, weekly]
        default: auto

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Skip if another recipe run started in the last 3 hours
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the outside timer and GitHub's own schedule can both fire; one run per window is
          # enough (a second one only burns the free Gemini quota and fails)
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w content.yml -L 6 --json databaseId,createdAt \
            -q "[.[] | select(.databaseId != ${{ github.run_id }}) | select((now - (.createdAt|fromdateiso8601)) < 10800)] | length")
          if [ "${n:-0}" -gt 0 ] && [ "${{ inputs.mode }}" != "weekly" ]; then
            echo "another recipe run started recently - skipping"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != '1'
      - uses: actions/setup-python@v7
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != '1'
      - name: Generate recipes
        if: steps.guard.outputs.skip != '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ "${{ inputs.mode }}" = "weekly" ]; then
            python src/gen_recipes.py || { echo "::error::recipe generation produced nothing - see log"; exit 1; }
          else
            python src/gen_recipes.py --auto || { echo "::error::recipe generation produced nothing - see log"; exit 1; }
          fi
      - name: Commit recipes
        if: steps.guard.outputs.skip != '1'
        run: |
          git config user.name "pin-bot"
          git config user.email "pin-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "new recipes $(date -u +%F)"
          git pull -q --rebase && git push -q

  site:
    needs: generate
    uses: ./.github/workflows/pages.yml
    secrets: inherit
